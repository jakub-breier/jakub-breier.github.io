
name: Test Jekyll build

on:
  push:
    branches:
      - jekyll-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jupyter-nbconvert

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true

      - name: Build website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --lsi

      - name: Verify generated website
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/assets/css/main.css
          echo "Jekyll build successful"


      - name: Upload generated website
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-preview
          path: _site/
          retention-days: 7

