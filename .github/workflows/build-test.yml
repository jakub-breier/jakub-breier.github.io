
name: Test Jekyll build

on:
  push:
    branches:
      - jekyll-source

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Pull al-folio Docker image
        run: docker compose pull jekyll

      - name: Build website
        run: |
          docker compose run --rm --no-deps \
            -e JEKYLL_ENV=production \
            jekyll bash -lc \
            'bundle install && exec jekyll build --lsi'

      - name: Verify generated website
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/assets/css/main.css
          echo "Jekyll build successful"

